<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Perch logo: a white geometric bird sitting on a dark island bar, on an indigo-to-teal tile</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#tile)"/>
  <!-- the island bar the bird perches on -->
  <rect x="44" y="166" width="168" height="40" rx="20" fill="#0B0B14"/>
  <circle cx="190" cy="186" r="6" fill="#2DD4BF"/>
  <!-- tail -->
  <path d="M86 150 L48 128 L60 158 Z" fill="#E2E8F0"/>
  <!-- body -->
  <ellipse cx="118" cy="138" rx="46" ry="30" fill="#F8FAFC"/>
  <!-- head -->
  <circle cx="160" cy="104" r="26" fill="#F8FAFC"/>
  <!-- beak -->
  <path d="M182 98 L206 106 L182 114 Z" fill="#FBBF24"/>
  <!-- eye -->
  <circle cx="166" cy="100" r="4.5" fill="#0B0B14"/>
  <!-- wing -->
  <path d="M96 128 Q122 112 146 134 Q120 150 96 128 Z" fill="#CBD5E1"/>
  <!-- feet -->
  <rect x="106" y="160" width="5" height="10" rx="2" fill="#0B0B14"/>
  <rect x="126" y="160" width="5" height="10" rx="2" fill="#0B0B14"/>
</svg>
